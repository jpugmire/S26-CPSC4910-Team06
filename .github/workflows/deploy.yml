name: Deploy to EC2
on:
  push:
    branches: [ "Master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3

      - name: Run tests
        run: |
          npm install
          npm test

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SERVER_SSH }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e

            # Install Node.js if not present
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # Install PM2 if not present
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # Clone repo if not present
            if [ ! -d ~/S26-CPSC4910-Team06 ]; then
              git clone https://github.com/jpugmire/S26-CPSC4910-Team06.git ~/S26-CPSC4910-Team06
            fi

            cd ~/S26-CPSC4910-Team06

            # Write .env on the EC2 instance
            cat > .env << ENVFILE
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          NEXTAUTH_URL=http://${{ secrets.EC2_HOST }}:3000
          ENVFILE

            # Pull latest code
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}

            # Install dependencies and generate Prisma client
            npm install
            npx prisma generate
            npx prisma migrate deploy

            # Build the application
            npm run build

            # Restart or start the app with PM2
            pm2 restart nextjs --update-env 2>/dev/null || pm2 start npm --name "nextjs" -- start
            pm2 save
          EOF
