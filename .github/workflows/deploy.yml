name: Deploy to EC2
on:
  push:
    branches: [ "Master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install Dependencies
        run: |
          npm install

      - name: Run Tests
        run: |
          npm test

      - name: Generate prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy
        env: 
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_URL: http://${{ secrets.EC2_HOST }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_USE_SANDBOX: ${{ secrets.EBAY_USE_SANDBOX }}
      
      - name: Copy static assets into standalone
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public || true

      - name: Create deployment archive
        run: tar -czf deploy.tar.gz -C .next/standalone .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-archive
          path: deploy.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-archive

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SERVER_SSH }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Copy archive to EC2
        run: scp -o StrictHostKeyChecking=no deploy.tar.gz ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/deploy.tar.gz

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e

            # Install Node.js if not present
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # Install PM2 if not present
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # Create app directory if needed
            mkdir -p ~/app

            # Extract new build, replacing old one
            tar -xzf ~/deploy.tar.gz -C ~/app
            rm ~/deploy.tar.gz

            # Write .env on the EC2 instance
            cat > ~/app/.env << ENVFILE
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          NEXTAUTH_URL=http://${{ secrets.EC2_HOST }}
          EBAY_CLIENT_ID=${{ secrets.EBAY_CLIENT_ID }}
          EBAY_REFRESH_TOKEN=${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_CLIENT_SECRET=${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_USE_SANDBOX=${{ secrets.EBAY_USE_SANDBOX }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          AUTH_TRUST_HOST=true
          ENVFILE

            # Restart or start the app with PM2
            cd ~/app
            pm2 restart nextjs --update-env 2>/dev/null || pm2 start server.js --name "nextjs"
            pm2 save

          EOF
